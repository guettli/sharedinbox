repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/guettli/sync-branch
    rev: v0.0.11
    hooks:
      - id: sync-branch

  - repo: local
    hooks:
      - id: check-no-binary
        name: check for binary files (build artifacts, databases)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && scripts/check_no_binary.sh'
        pass_filenames: false
        always_run: true
      - id: forbidden-files-hook
        name: check for forbidden home-directory files
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && task check-hygiene'
        pass_filenames: false
        always_run: true
      - id: dart-check
        name: dart format (autofix) + check-fast (parallel)
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && dagger call --progress=plain -q -m ci --source=. check-fast'
        pass_filenames: false
        always_run: true
      - id: dagger-progress-plain
        name: ensure all dagger calls use --progress=plain
        language: system
        entry: "bash -c 'git --no-pager grep \"dagger call\" -- \":!.pre-commit-config.yaml\" | grep -v \"\\-\\-progress=plain\" && echo \"ERROR: All dagger calls must include --progress=plain\" && exit 1 || exit 0'"
        pass_filenames: false
        always_run: true
      - id: ci-image-exists
        name: verify container images in ci/main.go are reachable
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && task check-ci-images'
        pass_filenames: false
        files: ^(ci/main\.go|\.fvmrc)$
      - id: dagger-versions-aligned
        name: verify Dagger version is consistent across dagger.json, Dockerfiles and DAGGER.md
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && scripts/check_dagger_versions.sh'
        pass_filenames: false
        files: ^(ci/dagger\.json|Dockerfile\.dev|DAGGER\.md)$
      - id: ci-monitor-sync
        name: ci-monitor.sh and k8s/ci-monitor.yaml stay in sync
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && scripts/check_ci_monitor_sync.sh'
        pass_filenames: false
        files: ^(scripts/ci-monitor\.sh|k8s/ci-monitor\.yaml)$
      - id: ci-monitor-tests
        name: ci-monitor unit tests
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/test_ci_monitor.sh'
        pass_filenames: false
        files: ^scripts/(ci-monitor|test_ci_monitor)\.sh$
      - id: duplication-orchestrator-tests
        name: duplication orchestrator unit tests
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/test_detect_duplication.py'
        pass_filenames: false
        files: ^scripts/(detect_duplication\.py|test_detect_duplication\.py)$
      - id: timed-wrapper-tests
        name: timed.sh wrapper tests
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bash scripts/test_timed.sh'
        pass_filenames: false
        files: ^scripts/(timed|test_timed)\.sh$
      - id: firebase-failure-issue-tests
        name: firebase failure-issue creator unit tests
        language: system
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/test_create_firebase_failure_issue.py'
        pass_filenames: false
        files: ^scripts/(create_firebase_failure_issue|test_create_firebase_failure_issue)\.py$
