name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate
    runs-on: sharedinbox-arc
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'
    env:
      RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}

    steps:
      - uses: actions/checkout@v5

      # Prefer a GitHub App installation token. It is minted fresh on every run
      # so it can never expire, and unlike the workflow's own github.token it
      # can trigger CI on the PRs Renovate opens, which auto-merge depends on.
      # Skipped when the app is not configured, and non-fatal so a bad key
      # falls back to github.token below.
      - name: Generate GitHub App token
        id: app-token
        if: env.RENOVATE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      # When the app token is unavailable, fall back to the workflow's own
      # github.token rather than a personal access token. A PAT expires silently
      # and, because GitHub Actions treats a non-empty (but expired) secret as
      # truthy, an expired RENOVATE_TOKEN would win the `||` chain and hard-fail
      # the run with "401 unauthorized" / "Authentication failure" (issues #441,
      # #444). github.token always authenticates so Renovate keeps running; it
      # cannot trigger CI on Renovate's PRs, so configure the GitHub App above to
      # restore CI-triggering and native auto-merge.
      - name: Run Renovate
        env:
          DAGGER_NO_NAG: "1"
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: task renovate
