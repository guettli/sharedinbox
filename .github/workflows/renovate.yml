name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate
    runs-on: sharedinbox-arc
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'

    steps:
      - uses: actions/checkout@v4

      - name: Check runner tools
        run: |
          command -v dagger  >/dev/null 2>&1 || { echo "ERROR: dagger is not installed in the runner image."; exit 1; }
          command -v task    >/dev/null 2>&1 || { echo "ERROR: task is not installed in the runner image."; exit 1; }

      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Run Renovate
        env:
          DAGGER_NO_NAG: "1"
          GITHUB_TOKEN: ${{ secrets.RENOVATE_TOKEN || github.token }}
        run: task renovate
