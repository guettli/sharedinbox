name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# github.token is only used by actions/checkout below; Renovate itself
# authenticates with the RENOVATE_TOKEN PAT (see the "Run Renovate" step).
permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: sharedinbox-arc
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Run Renovate
        env:
          DAGGER_NO_NAG: "1"
          # Must be a PAT (or GitHub App token), NOT the ephemeral github.token:
          # Renovate rejects the Actions token as an integration token and fails
          # with "integration-unauthorized" when creating PRs/issues. No fallback
          # here on purpose — a missing secret trips the `task renovate`
          # precondition and fails the run loudly instead of silently degrading.
          GITHUB_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: task renovate
