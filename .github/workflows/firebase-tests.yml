name: Firebase Tests

on:
  schedule:
    - cron: '0 * * * *'   # hourly; the script exits early when the last green
                          # run is within 12h, when the latest alpha was
                          # already tested, or when its split APKs are not
                          # generated yet — so most ticks are nearly free
  workflow_dispatch:

# Hourly schedule + a 60-minute timeout means runs could overlap while a real
# test is in flight. Queue rather than cancel so we don't kill a Firebase Test
# Lab job halfway through.
concurrency:
  group: firebase-tests
  cancel-in-progress: false

jobs:
  test-android-firebase:
    name: Android Robo Crawl (Firebase Test Lab) — Play Store alpha
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    if: github.server_url == 'https://github.com'
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Print runner wait time
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      # PLAY_STORE_CONFIG_JSON, FIREBASE_TEST_LAB_SERVICE_ACCOUNT_KEY and GITHUB_TOKEN
      # are exported into GITHUB_ENV by the Setup Dagger Remote Engine step above
      # (decrypted from secrets.enc.yaml). Do not re-declare them as step env —
      # ${{ secrets.* }} would overwrite the SOPS-decrypted value, and re-declaring
      # GITHUB_TOKEN with the weak github.token would break the version-code cache
      # write (only the SOPS PAT can manage Actions variables). GITHUB_API_URL and
      # GITHUB_REPOSITORY are provided automatically by the runner. The Firebase
      # project ID is derived from FIREBASE_TEST_LAB_SERVICE_ACCOUNT_KEY.project_id
      # inside the Dagger pipeline, so it is not plumbed through here.
      - name: Run Android Tests on Firebase Test Lab
        env:
          DAGGER_NO_NAG: "1"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.agentloop.svc.cluster.local:4318
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${{ env.AGENTLOOP_OTEL_TOKEN }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        run: task test-android-firebase

      - name: Create issue on test failure
        if: failure()
        env:
          DAGGER_NO_NAG: "1"
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dagger call --progress=plain -q -m ci --source=. create-firebase-failure-issue \
            --github-token env:GITHUB_TOKEN \
            --run-url "$RUN_URL" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-api-url "$GITHUB_API_URL"
