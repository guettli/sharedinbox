name: Firebase Tests

on:
  schedule:
    - cron: '0 * * * *'   # hourly; the script exits early when the last green
                          # run is within 12h, when the latest alpha was
                          # already tested, or when its split APKs are not
                          # generated yet — so most ticks are nearly free
  workflow_dispatch:

# Hourly schedule + a 60-minute timeout means runs could overlap while a real
# test is in flight. Queue rather than cancel so we don't kill a Firebase Test
# Lab job halfway through.
concurrency:
  group: firebase-tests
  cancel-in-progress: false

jobs:
  test-android-firebase:
    name: Android Robo Crawl (Firebase Test Lab) — Play Store alpha
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    if: github.server_url == 'https://github.com'
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Print runner wait time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/print_runner_wait.sh

      - name: Check runner tools
        run: |
          command -v dagger  >/dev/null 2>&1 || { echo "ERROR: dagger is not installed in the runner image."; exit 1; }
          command -v task    >/dev/null 2>&1 || { echo "ERROR: task is not installed in the runner image."; exit 1; }

      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      # PLAY_STORE_CONFIG_JSON, FIREBASE_TEST_LAB_SERVICE_ACCOUNT_KEY and GITHUB_TOKEN
      # are exported into GITHUB_ENV by the Setup Dagger Remote Engine step above
      # (decrypted from secrets.enc.yaml). Do not re-declare them as step env —
      # ${{ secrets.* }} would overwrite the SOPS-decrypted value, and re-declaring
      # GITHUB_TOKEN with the weak github.token would break the version-code cache
      # write (only the SOPS PAT can manage Actions variables). GITHUB_API_URL and
      # GITHUB_REPOSITORY are provided automatically by the runner. The Firebase
      # project ID is derived from FIREBASE_TEST_LAB_SERVICE_ACCOUNT_KEY.project_id
      # inside the Dagger pipeline, so it is not plumbed through here.
      - name: Run Android Tests on Firebase Test Lab
        env:
          DAGGER_NO_NAG: "1"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.agentloop.svc.cluster.local:4318
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${{ env.AGENTLOOP_OTEL_TOKEN }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        run: task test-android-firebase

      - name: Create issue on test failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request, urllib.error

          token = os.environ["GITHUB_TOKEN"]
          api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = os.environ["RUN_URL"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          api = f"{api_base}/repos/{repo}"

          def api_get(path):
              req = urllib.request.Request(f"{api}{path}", headers=headers, method="GET")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def api_post(path, body):
              data = json.dumps(body).encode()
              req = urllib.request.Request(f"{api}{path}", data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          title = "Firebase Tests failed — find root cause and fix"

          # Hourly runs would otherwise pile up duplicate failure issues until
          # a fix lands; only open a new one when no open issue carries this
          # title. The list endpoint returns both issues and PRs — filter PRs.
          existing = [
              i for i in api_get("/issues?state=open&labels=loop/code&per_page=100")
              if i["title"] == title and not i.get("pull_request")
          ]
          if existing:
              print(f"Existing open issue #{existing[0]['number']} — not creating duplicate")
          else:
              body = (
                  "Firebase robo crawl of the Play Store **alpha** APK failed in the hourly run.\n\n"
                  f"**Failed run:** {run_url}\n\n"
                  "## Steps to resolve\n\n"
                  "1. **Find the root cause**: Check the test run logs linked above. The job runs `gcloud firebase test android run --type robo` against the split APKs downloaded from the alpha track, so a failure means the production binary either crashed (look for `FATAL EXCEPTION` / `Process … has died`) or the robo crawl reported `Failed`/`Inconclusive`.\n"
                  "2. **Fix if possible**: If the failure is caused by a code bug, create a fix. If it is a flaky or infrastructure issue, document the findings.\n"
                  "3. Close this issue once the root cause is resolved and the tests pass.\n"
              )
              # `automerge` so once the agentloop ships a fix and CI is green
              # on the PR, it lands without a human round-trip.
              issue = api_post("/issues", {
                  "title": title,
                  "body": body,
                  "labels": ["loop/code", "automerge"],
              })
              print(f"Created issue #{issue['number']}: {issue['html_url']}")
          PYEOF
