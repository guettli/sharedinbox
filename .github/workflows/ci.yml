name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Hosted watchdog: the "Full Project Check" job runs on the self-hosted
  # sharedinbox-arc scale set. When that fleet is down, GitHub leaves the job
  # "waiting for a runner" for 24h and then fails it with a useless timeout
  # message. This job runs on an always-available GitHub-hosted runner and,
  # if no arc runner has picked up the check within 15 min, fails fast with an
  # actionable error instead. Runs in parallel with `check` (not a dependency),
  # so it never delays a healthy run.
  runner-watchdog:
    name: Runner availability watchdog
    runs-on: ubuntu-latest
    # Above the script's 230-min queue budget below: a cancelled watchdog
    # would fail the whole run even when the check later passes.
    timeout-minutes: 240
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
    steps:
      - name: Fail fast if no self-hosted runner picks up the check job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The check runs on sharedinbox-arc-check, which has ONE runner, so it
          # normally queues behind other runs' checks. Fail only after 15 min in
          # which NO ci.yml run had a Full Project Check in progress: a check
          # running anywhere proves the scale set is servicing jobs, so it
          # pushes the deadline out. Keep polling rather than exit on that, so
          # a fleet that breaks while we queue is still caught.
          IDLE_LIMIT=900   # 15 min; a healthy ARC fleet cold-starts a runner in ~1-3 min
          BUDGET=13800     # 230 min of queueing behind others: then stop watching,
                           # GithubActionsRunQueuedTooLong (gitops vmalert) takes over
          deadline=$((SECONDS + IDLE_LIMIT))
          echo "Watching for a sharedinbox-arc-check runner to start 'Full Project Check'..."
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                        --jq '.jobs[] | select(.name=="Full Project Check") | .status' 2>/dev/null | head -n1 || true)"
            echo "[$(date -u +%H:%M:%S)] Full Project Check: ${status:-<not scheduled yet>}"
            case "${status}" in
              in_progress|completed)
                echo "A self-hosted runner picked up the job — the ARC fleet is healthy."
                exit 0 ;;
            esac
            busy="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=in_progress&per_page=20" \
                      --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" 2>/dev/null || true)"
            for run in ${busy}; do
              other="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs" \
                         --jq '.jobs[] | select(.name=="Full Project Check" and .status=="in_progress") | .id' 2>/dev/null | head -n1 || true)"
              if [ -n "${other}" ]; then
                echo "  queued behind run ${run}, whose Full Project Check is in progress — fleet is servicing jobs"
                deadline=$((SECONDS + IDLE_LIMIT))
                break
              fi
            done
            if [ "${SECONDS}" -ge "${BUDGET}" ]; then
              echo "::warning title=Long CI queue::Still queued after $((BUDGET / 60)) min while other checks kept running — a backlog, not a dead fleet. Stopping the watch."
              exit 0
            fi
            sleep 20
          done
          echo "::error title=No self-hosted runner available::'Full Project Check' was not picked up by a sharedinbox-arc-check runner, and no other check ran, for 15 minutes — failing fast instead of the silent 24h queue timeout."
          echo "The self-hosted ARC runner fleet is not servicing jobs. Likely causes (see the arc-runner-secrets runbook):" >&2
          echo "  * the shared guettli GITHUB_ADMIN_TOKEN expired -> ARC listeners crash-loop '401 Bad credentials'" >&2
          echo "    (kubectl -n arc-systems logs -l app.kubernetes.io/component=runner-scale-set-listener)" >&2
          echo "  * the ghcr.io/guettli/sharedinbox-ci-runner image can't be pulled -> runner pods in ImagePullBackOff" >&2
          echo "    (kubectl -n arc-runners get pods)" >&2
          echo "  * the sharedinbox-arc-check scale set is missing or Outdated" >&2
          echo "    (kubectl -n arc-runners get autoscalingrunnerset)" >&2
          echo "Fix the fleet, then re-run this workflow." >&2
          exit 1

  check:
    name: Full Project Check
    # Its own one-runner ARC scale set (gitops
    # k8s/helm-values/vps/arc-runner-set-sharedinbox-check.yaml): at most one
    # full check on tc's shared Dagger engine at a time. Two at once next to
    # Deploy's Gradle build OOM-killed the engine on 2026-11-13. Extra checks
    # queue for the runner; a `concurrency` group would cancel them instead.
    runs-on: sharedinbox-arc-check
    # 75, not 60: check-dagger's worst case is 3 x 910s attempts plus two
    # prune+settle pauses (~53 min), and setup + print-runner-wait run first.
    timeout-minutes: 75
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v5
      # sops, dagger and task come from the sharedinbox-arc runner image
      # (arc-runner-image/Dockerfile), which is the single source of truth for
      # their versions. We deliberately do NOT reinstall them here: if the
      # runner image is wrong, CI must fail loudly rather than be silently
      # patched at job time. See guettli/otelhouse#33.
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh
      - name: Check Dagger version pins against the live engine
        # Must run OUTSIDE the Dagger pipeline: a version mismatch is exactly
        # the condition that stops the pipeline from loading, so a check that
        # lives inside it can never report the problem it exists to catch.
        # Runs after the tunnel is up so it can query the engine's real version
        # instead of comparing in-repo pins to each other (issue #445).
        run: scripts/check_dagger_versions.sh --engine
      - name: Print runner wait time
        # Purely diagnostic: prints only how long the job waited in the runner
        # queue. Don't let a Docker Hub hiccup while pulling its base image
        # (TLS handshake timeout to auth.docker.io — see #453) fail the job
        # before the real work runs.
        continue-on-error: true
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"
      # Export Dagger's OTEL traces to the persistent agentloop collector on
      # every run that has the collector token — pushes to main AND pull
      # requests. PR runs are the cold-cache case (6-13 min); main pushes are
      # near-warm (~1 min), so tracing only main measured the fast path and left
      # the slow one blind (#649, #693). Each span carries git.ref and ci.event,
      # so main-only wall-time stays queryable commit-to-commit — filter on
      # `ci.event = 'push' AND git.ref = 'main'`.
      #
      # The gate is the token, not the branch: AGENTLOOP_OTEL_TOKEN is put into
      # $GITHUB_ENV by the earlier "Setup Dagger Remote Engine" step, and is
      # empty on fork PRs (no secrets). Empty -> skip, so we never export with a
      # bearer the tenantauth collector would reject.
      - name: Enable OTEL export (when collector token is available)
        if: env.AGENTLOOP_OTEL_TOKEN != ''
        run: |
          {
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.agentloop.svc.cluster.local:4318"
            echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer $AGENTLOOP_OTEL_TOKEN"
            echo "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
            echo "OTEL_RESOURCE_ATTRIBUTES=service.name=sharedinbox-ci,git.sha=$GITHUB_SHA,git.ref=$GITHUB_REF_NAME,ci.event=$GITHUB_EVENT_NAME,ci.run_id=$GITHUB_RUN_ID,ci.run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
      - name: Run Full Check Suite
        run: task check-dagger
