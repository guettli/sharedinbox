name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Full Project Check
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4
      - name: Print runner wait time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/print_runner_wait.sh
      # sops, dagger and task are baked into the sharedinbox-arc self-hosted runner
      # image but are absent from GitHub-hosted ubuntu-latest. Install them with
      # the same versions pinned in Dockerfile.dev (dagger/task) and
      # publish-dev-container.yml (sops).
      - name: Install runner tools
        run: |
          sudo curl -fsSL \
            https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 \
            -o /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          curl -fsSL https://taskfile.dev/install.sh \
            | sudo sh -s -- -b /usr/local/bin v3.48.0
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | sudo DAGGER_VERSION=0.21.6 BIN_DIR=/usr/local/bin sh
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh
      - name: Run Full Check Suite
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.agentloop.svc.cluster.local:4318
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${{ env.AGENTLOOP_OTEL_TOKEN }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        run: task check-dagger
