name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Hosted watchdog: the "Full Project Check" job runs on the self-hosted
  # sharedinbox-arc scale set. When that fleet is down, GitHub leaves the job
  # "waiting for a runner" for 24h and then fails it with a useless timeout
  # message. This job runs on an always-available GitHub-hosted runner and,
  # if no arc runner has picked up the check within 15 min, fails fast with an
  # actionable error instead. Runs in parallel with `check` (not a dependency),
  # so it never delays a healthy run.
  runner-watchdog:
    name: Runner availability watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
    steps:
      - name: Fail fast if no self-hosted runner picks up the check job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          DEADLINE=900   # 15 min; a healthy ARC fleet cold-starts a runner in ~1-3 min
          echo "Watching for a sharedinbox-arc runner to start 'Full Project Check' (max 15 min)..."
          while [ "${SECONDS}" -lt "${DEADLINE}" ]; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                        --jq '.jobs[] | select(.name=="Full Project Check") | .status' 2>/dev/null | head -n1 || true)"
            echo "[$(date -u +%H:%M:%S)] Full Project Check: ${status:-<not scheduled yet>}"
            case "${status}" in
              in_progress|completed)
                echo "A self-hosted runner picked up the job — the ARC fleet is healthy."
                exit 0 ;;
            esac
            sleep 20
          done
          echo "::error title=No self-hosted runner available::'Full Project Check' was not picked up by a sharedinbox-arc runner within 15 minutes — failing fast instead of the silent 24h queue timeout."
          echo "The self-hosted ARC runner fleet is not servicing jobs. Likely causes (see the arc-runner-secrets runbook):" >&2
          echo "  * the shared guettli GITHUB_ADMIN_TOKEN expired -> ARC listeners crash-loop '401 Bad credentials'" >&2
          echo "    (kubectl -n arc-systems logs -l app.kubernetes.io/component=runner-scale-set-listener)" >&2
          echo "  * the ghcr.io/guettli/sharedinbox-ci-runner image can't be pulled -> runner pods in ImagePullBackOff" >&2
          echo "    (kubectl -n arc-runners get pods)" >&2
          echo "Fix the fleet, then re-run this workflow." >&2
          exit 1

  check:
    name: Full Project Check
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v5
      # sops, dagger and task come from the sharedinbox-arc runner image
      # (arc-runner-image/Dockerfile), which is the single source of truth for
      # their versions. We deliberately do NOT reinstall them here: if the
      # runner image is wrong, CI must fail loudly rather than be silently
      # patched at job time. See guettli/otelhouse#33.
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh
      - name: Check Dagger version pins against the live engine
        # Must run OUTSIDE the Dagger pipeline: a version mismatch is exactly
        # the condition that stops the pipeline from loading, so a check that
        # lives inside it can never report the problem it exists to catch.
        # Runs after the tunnel is up so it can query the engine's real version
        # instead of comparing in-repo pins to each other (issue #445).
        run: scripts/check_dagger_versions.sh --engine
      - name: Print runner wait time
        # Purely diagnostic: prints only how long the job waited in the runner
        # queue. Don't let a Docker Hub hiccup while pulling its base image
        # (TLS handshake timeout to auth.docker.io — see #453) fail the job
        # before the real work runs.
        continue-on-error: true
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"
      # Export Dagger's OTEL traces to the persistent agentloop collector ONLY
      # on pushes to main, so CI wall-time is comparable commit-to-commit (#649).
      # Setting the vars into $GITHUB_ENV (rather than step-level env) means on
      # PRs they stay unset and Dagger exports nowhere. AGENTLOOP_OTEL_TOKEN was
      # put into $GITHUB_ENV by the earlier "Setup Dagger Remote Engine" step.
      - name: Enable OTEL export (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.agentloop.svc.cluster.local:4318"
            echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer $AGENTLOOP_OTEL_TOKEN"
            echo "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
            echo "OTEL_RESOURCE_ATTRIBUTES=service.name=sharedinbox-ci,git.sha=$GITHUB_SHA,git.ref=$GITHUB_REF_NAME,ci.run_id=$GITHUB_RUN_ID,ci.run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
      - name: Run Full Check Suite
        run: task check-dagger
