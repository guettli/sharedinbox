name: Publish CI Runner Image

# Builds the sharedinbox-arc runner image (arc-runner-image/Dockerfile) and
# pushes it to ghcr.io/guettli/sharedinbox-ci-runner. This image is the single
# source of truth for the CI toolchain (sops/dagger/task): CI workflows rely on
# the baked versions and never reinstall them at job time. See guettli/otelhouse#33.

on:
  push:
    branches: [main]
    paths:
      - 'arc-runner-image/**'
      - '.github/workflows/publish-ci-runner.yml'
  # Pull requests build and smoke-test the image but push nothing: this is
  # what tests Renovate's bump of the actions-runner base before it merges.
  pull_request:
    paths:
      - 'arc-runner-image/**'
      - '.github/workflows/publish-ci-runner.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push sharedinbox-ci-runner
    # Runs on a GitHub-hosted runner ON PURPOSE: this job builds the very image
    # that the sharedinbox-arc runners boot from, so it must NOT depend on that
    # runner (otherwise, if the image is ever missing, the only thing that can
    # rebuild it is itself -- an unrecoverable bootstrap deadlock). Building the
    # image needs only Docker, not the in-cluster Dagger engine, so a hosted
    # runner is sufficient. The repo is public, so hosted minutes are free.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/guettli/sharedinbox-ci-runner

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # v<YYYY.MM.DD.HHMMSS> of the BUILD time (UTC), next to the short SHA.
      # gitops Renovate follows only the v… tags (they sort; SHAs do not) and
      # auto-merges them into k8s/helm-values/vps/arc-runner-set.yaml. Build
      # time, not commit time: a workflow_dispatch rebuild of the same commit
      # must get a NEW tag. Re-pushing a tag is what bit us before -- the zot
      # pull-through cache in front of ghcr kept serving the old content of a
      # moved tag (`:latest`, 2026-11-05), so a v-tag is never re-pushed and
      # `:latest` is no longer pushed. (The short-SHA tag does move on such a
      # rebuild; nothing deploys it.)
      - name: Compute tags
        run: |
          echo "VERSION=v$(date -u +%Y.%m.%d.%H%M%S)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$SHORT_SHA" \
            -f arc-runner-image/Dockerfile \
            arc-runner-image

      # The tag is auto-merged and rolled out with no human in between, and
      # CI cannot run on a broken runner image to tell us. So check here,
      # before pushing, that the runner starts and the baked toolchain runs.
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint bash "$IMAGE:$VERSION" -euo pipefail -c '
            /home/runner/bin/Runner.Listener --version
            sops --version
            dagger version
            task --version
            jq --version
            python3 -c "import google.auth, requests"
          '

      # The newest v-tag is rolled out unattended, so it must hold what main
      # holds NOW. Not a branch (workflow_dispatch can run on any ref), and not
      # an older main commit ("Re-run jobs" on an old run would otherwise stamp
      # old content with the newest tag and roll the runners back). Compared by
      # the git trees of the image inputs, not by commit: an unrelated commit
      # landing on main during the build must not cancel the publish (it would
      # not trigger this workflow again).
      - name: Check the image inputs equal the head of main
        if: github.event_name != 'pull_request'
        id: head
        run: |
          git fetch -q --depth=1 origin main
          inputs() { git rev-parse "${1}:arc-runner-image" "${1}:.github/workflows/publish-ci-runner.yml"; }
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$(inputs HEAD)" = "$(inputs FETCH_HEAD)" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not pushing: the image inputs of $GITHUB_REF@$GITHUB_SHA differ from the head of main."
          fi

      - name: Push image
        if: steps.head.outputs.push == 'true'
        run: |
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:$VERSION"
          echo "Pushed $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
