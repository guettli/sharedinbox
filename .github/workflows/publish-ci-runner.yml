name: Publish CI Runner Image

# Builds the sharedinbox-arc runner image (arc-runner-image/Dockerfile) and
# pushes it to ghcr.io/guettli/sharedinbox-ci-runner. This image is the single
# source of truth for the CI toolchain (sops/dagger/task): CI workflows rely on
# the baked versions and never reinstall them at job time. See guettli/otelhouse#33.

on:
  push:
    branches: [main]
    paths:
      - 'arc-runner-image/Dockerfile'
      - '.github/workflows/publish-ci-runner.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push sharedinbox-ci-runner
    runs-on: sharedinbox-arc
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'
    permissions:
      packages: write

    env:
      IMAGE: ghcr.io/guettli/sharedinbox-ci-runner

    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: arc-runner-image
          file: arc-runner-image/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
