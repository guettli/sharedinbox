name: Publish Dev Container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.dev'
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/publish-dev-container.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push sharedinbox-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.server_url != 'https://github.com'
    # REGISTRY_TOKEN must be set as a repo secret: a Gitea personal access token
    # for guettlibot with package-write scope. The auto-provisioned github.token
    # does not authenticate against sialoop's container registry.
    permissions:
      packages: write
    env:
      REGISTRY: sialoop.thomas-guettler.de
      IMAGE: sialoop.thomas-guettler.de/guettli/sharedinbox-dev

    steps:
      - uses: actions/checkout@v4

      - name: Log in to sialoop container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "$REGISTRY" -u guettlibot --password-stdin

      - name: Build image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            -f Dockerfile.dev \
            .

      - name: Push image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
