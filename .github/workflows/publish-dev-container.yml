name: Publish Dev Container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.dev'
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/publish-dev-container.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push sharedinbox-dev
    runs-on: sharedinbox-arc
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'
    # The auto-provisioned github.token does not authenticate against sialoop's
    # container registry. REGISTRY_TOKEN is read from secrets.enc.yaml (decrypted
    # at runtime with SOPS_AGE_KEY) and belongs to guettlibot.
    permissions:
      packages: write
    env:
      REGISTRY: sialoop.thomas-guettler.de
      IMAGE: sialoop.thomas-guettler.de/guettlibot/sharedinbox-dev

    steps:
      - uses: actions/checkout@v4

      - name: Install sops
        run: |
          curl -sSfL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 \
            -o /usr/local/bin/sops && chmod +x /usr/local/bin/sops

      - name: Log in to sialoop container registry
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          REGISTRY_TOKEN=$(sops -d --extract '["REGISTRY_TOKEN"]' secrets.enc.yaml)
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u guettlibot --password-stdin

      - name: Build image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            -f Dockerfile.dev \
            .

      - name: Push image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
