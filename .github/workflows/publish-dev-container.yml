name: Publish Dev Container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.dev'
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/publish-dev-container.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push sharedinbox-dev
    runs-on: sharedinbox-arc
    timeout-minutes: 30
    if: github.server_url == 'https://github.com'
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Build & push dev container via Dagger
        env:
          DAGGER_NO_NAG: "1"
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. publish-dev-container \
            --registry-token env:REGISTRY_TOKEN \
            --registry-user "${{ github.actor }}" \
            --image-ref ghcr.io/guettli/sharedinbox-dev \
            --commit-sha "$GITHUB_SHA"
