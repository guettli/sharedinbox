name: Deploy

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:

# Serialize Deploy runs so the next hourly cron queues behind any still-running
# run instead of starting in parallel. Two concurrent Deploy runs share the
# gradle-cache Dagger volume and race on /home/ci/.gradle/caches/journal-1.lock,
# which aborts whichever Gradle invocation can't acquire the lock within 60s
# (see #151 — a 1h9m run still held the lock when the next hourly cron fired).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-changes:
    name: Detect Changed Files
    runs-on: sharedinbox-arc
    timeout-minutes: 5
    if: github.server_url == 'https://github.com'
    outputs:
      android: ${{ steps.diff.outputs.android }}
      linux: ${{ steps.diff.outputs.linux }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Print runner wait time
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      - name: Detect Android and Linux changes
        id: diff
        shell: bash
        env:
          DAGGER_NO_NAG: "1"
          GH_CHANGED_TARGETS_TOKEN: ${{ github.token }}
          TARGETS: '{"android":"^(android/|integration_test/|lib/|pubspec\\.yaml|pubspec\\.lock|drift_schemas/|scripts/deploy_playstore\\.py)","linux":"^(linux/|lib/|pubspec\\.yaml|pubspec\\.lock)"}'
        run: |
          RESULT=$(dagger call --progress=plain -q -m ci --source=. changed-targets \
            --github-token env:GH_CHANGED_TARGETS_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --workflow-file deploy.yml \
            --job-name "Build & Deploy to Play Store" \
            --targets "$TARGETS")
          # The Dagger function prints diagnostics on stderr and the JSON
          # verdict on stdout; the last non-empty line is the JSON object.
          JSON=$(printf '%s\n' "$RESULT" | awk 'NF{last=$0} END{print last}')
          ANDROID=$(printf '%s' "$JSON" | python3 -c 'import json,sys;print(str(json.load(sys.stdin).get("android",False)).lower())')
          LINUX=$(printf '%s' "$JSON" | python3 -c 'import json,sys;print(str(json.load(sys.stdin).get("linux",False)).lower())')
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX"     >> "$GITHUB_OUTPUT"

  deploy-playstore:
    name: Build & Deploy to Play Store
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    needs: [check-changes]
    if: needs.check-changes.outputs.android == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Print runner wait time
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      # Gate the release on a KVM launch smoke test BEFORE uploading to Play
      # Store: boot the signed release APK on an emulator inside Dagger (p16
      # engine) and fail if it crashes on launch. Catches release-only R8 /
      # NoClassDefFound / NoSuchMethod crashes (e.g. #100) before users can
      # install. Runs here at deploy time — not on every PR — so merges to main
      # stay fast; only the few changes that actually ship a release pay for it.
      - name: Smoke-test release build (KVM launch test)
        env:
          DAGGER_NO_NAG: "1"
        run: task smoke-test-release

      - name: Publish Android to Play Store
        env:
          DAGGER_NO_NAG: "1"
        run: task publish-android

      - name: Verify Play Store deployment
        env:
          DAGGER_NO_NAG: "1"
        run: |
          dagger call --progress=plain -q -m ci --source=. verify-play-store-deploy \
            --play-store-config env:PLAY_STORE_CONFIG_JSON


  deploy-apk:
    name: Build & Deploy APK to Server
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    # Wait for deploy-playstore (success or failure) before running so the two
    # Gradle invocations don't fight over the shared gradle-cache journal lock.
    needs: [check-changes, deploy-playstore]
    if: |
      always()
      && needs.check-changes.result == 'success'
      && needs.check-changes.outputs.android == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Print runner wait time
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      - name: Build & Deploy APK to server
        env:
          DAGGER_NO_NAG: "1"
        run: task deploy-apk


  build-linux:
    name: Build Linux Release
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    needs: [check-changes]
    if: needs.check-changes.outputs.linux == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Print runner wait time
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      - name: Build & Deploy Linux to server
        env:
          DAGGER_NO_NAG: "1"
        run: task deploy-linux


  label-deploy-health:
    name: Update Deploy Health Label
    runs-on: sharedinbox-arc
    needs: [deploy-playstore, deploy-apk, build-linux]
    if: |
      always() && github.server_url == 'https://github.com' && (
        needs.deploy-playstore.result == 'success' || needs.deploy-playstore.result == 'failure' ||
        needs.deploy-apk.result == 'success' || needs.deploy-apk.result == 'failure' ||
        needs.build-linux.result == 'success' || needs.build-linux.result == 'failure'
      )
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v5
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Set CI/Full-Pass or CI/Full-Fail label on tracking issue
        env:
          DAGGER_NO_NAG: "1"
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_HEALTH_ISSUE: ${{ vars.DEPLOY_HEALTH_ISSUE }}
          ALL_SUCCEEDED: ${{ (needs.deploy-playstore.result == 'success' || needs.deploy-playstore.result == 'skipped') && (needs.deploy-apk.result == 'success' || needs.deploy-apk.result == 'skipped') && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') }}
        run: |
          dagger call --progress=plain -q -m ci --source=. update-deploy-health-label \
            --github-token env:GITHUB_TOKEN \
            --issue-number "$DEPLOY_HEALTH_ISSUE" \
            --all-succeeded "$ALL_SUCCEEDED" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-api-url "$GITHUB_API_URL"
