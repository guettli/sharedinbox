name: Update Website

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/website-verify.sh'
      - 'scripts/generate_build_history.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Update Website
    runs-on: sharedinbox-arc
    timeout-minutes: 60
    if: github.server_url == 'https://github.com'

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Dagger Remote Engine
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/setup_dagger_remote.sh

      - name: Print runner wait time
        # Purely diagnostic: prints only how long the job waited in the runner
        # queue. Don't let a Docker Hub hiccup while pulling its base image
        # (TLS handshake timeout to auth.docker.io — see #453) fail the job
        # before the real work runs.
        continue-on-error: true
        env:
          DAGGER_NO_NAG: "1"
          GH_RUNNER_WAIT_TOKEN: ${{ github.token }}
        run: |
          dagger call --progress=plain -q -m ci --source=. print-runner-wait \
            --github-token env:GH_RUNNER_WAIT_TOKEN \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"

      - name: Build & Update Website
        env:
          DAGGER_NO_NAG: "1"
        run: task publish-website

      - name: Verify Website
        env:
          DAGGER_NO_NAG: "1"
          SSH_HOST: ${{ env.WEBSITE_SSH_HOST }}
        run: |
          dagger call --progress=plain -q -m ci --source=. website-verify \
            --commit-hash "$(git rev-parse --short HEAD)" \
            --ssh-key env:SSH_PRIVATE_KEY \
            --known-hosts env:SSH_KNOWN_HOSTS \
            --ssh-user "$SSH_USER" \
            --ssh-host "$SSH_HOST"
