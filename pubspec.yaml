name: sharedinbox
description: IMAP email client for Android, iOS, and Desktop.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Not used directly, but required to silence Flutter's "missing CupertinoIcons font" build warning.
  cupertino_icons: ^1.0.8

  enough_mail: ^2.1.7
  http: ^1.2.0

  # Local persistence (offline-first)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Secure credential storage (passwords)
  flutter_secure_storage: ^10.0.0

  # Date formatting
  intl: any

  # File picking (compose attachments) and opening downloaded attachments
  file_picker: ^8.0.0
  open_filex: ^4.6.0
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13
  test: ^1.25.0
  fake_async: ^1.3.1
  sqlite3: any  # used directly in test/unit/db_test_helper.dart

flutter:
  uses-material-design: true
