name: sharedinbox
description: IMAP email client for Android, iOS, and Desktop.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Forked IMAP/SMTP/MIME library — https://github.com/guettli/enough_mail
  enough_mail:
    git:
      url: https://github.com/guettli/enough_mail.git
      ref: 25320adab0d9c1d98c3602ebf53fb15e28e3a0e9

  # Local persistence (offline-first)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Secure credential storage (passwords)
  flutter_secure_storage: ^9.2.4

  # Date formatting
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13
  test: ^1.25.0

flutter:
  uses-material-design: true
