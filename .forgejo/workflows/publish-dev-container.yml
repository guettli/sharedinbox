name: Publish Dev Container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.dev'
      - '.devcontainer/devcontainer.json'
      - '.forgejo/workflows/publish-dev-container.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push sharedinbox-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The auto-provisioned Actions token needs package-write scope to log in to
    # and push to sialoop's (Gitea) container registry; without it docker login
    # returns "unauthorized" (#614 follow-up).
    permissions:
      packages: write
    env:
      REGISTRY: sialoop.thomas-guettler.de
      IMAGE: sialoop.thomas-guettler.de/guettli/sharedinbox-dev

    steps:
      - uses: actions/checkout@v4

      - name: Log in to sialoop container registry
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          echo "$FORGEJO_TOKEN" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            -f Dockerfile.dev \
            .

      - name: Push image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
