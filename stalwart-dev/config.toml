# Minimal Stalwart Mail configuration for local development and integration tests.
#
# HTTP only — localhost testing, no TLS.
# Two test accounts (alice, bob) for multi-account sync tests.

[server]
hostname = "localhost"

[[server.listener]]
id       = "jmap"
bind     = ["0.0.0.0:8080"]
protocol = "http"

[[server.listener]]
id       = "imap"
bind     = ["0.0.0.0:1430"]
protocol = "imap"

[[server.listener]]
id       = "smtp"
bind     = ["0.0.0.0:1025"]
protocol = "smtp"

[[server.listener]]
id       = "managesieve"
bind     = ["0.0.0.0:4190"]
protocol = "managesieve"

[store."db"]
type = "sqlite"
path = "/tmp/stalwart/data.sqlite"

[storage]
data      = "db"
fts       = "db"
blob      = "db"
lookup    = "db"
directory = "memory"

[tracer."stdout"]
type    = "stdout"
level   = "warn"
ansi    = false
enable  = true

[directory."memory"]
type = "memory"

[[directory."memory".principals]]
class  = "individual"
name   = "alice@example.com"
secret = "secret"
email  = ["alice@example.com"]

[[directory."memory".principals]]
class  = "individual"
name   = "bob@example.com"
secret = "secret"
email  = ["bob@example.com"]

# Pool of sharded users so backend tests can run in parallel: each Dart test
# isolate picks a user by pid % N and gets its own mailbox namespace, so
# per-test INBOX/Trash resets no longer race. N=32 covers realistic CPU
# counts with negligible boot cost for the in-memory directory.

